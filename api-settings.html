
<style>
/* Eye toggle for secret fields */
.secret-field-wrap {
  position: relative;
  width: 100%;
}

.secret-field-wrap input {
  width: 100% !important;
  box-sizing: border-box !important;
  padding-right: 48px !important;
}

.secret-eye-btn {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  border: 1px solid #673ab7;
  border-radius: 8px;
  background: #211532;
  color: #c084fc;
  cursor: pointer;
  font-size: 17px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}

.secret-eye-btn:hover {
  background: #3b2060;
}
</style>

<script>
(function () {
  function addEyeToggle(input) {
    if (!input || input.dataset.eyeAdded === "true") return;

    input.dataset.eyeAdded = "true";

    const wrap = document.createElement("div");
    wrap.className = "secret-field-wrap";

    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);

    const button = document.createElement("button");
    button.type = "button";
    button.className = "secret-eye-btn";
    button.textContent = "👁";
    button.title = "Show/Hide";
    button.setAttribute("aria-label", "Show or hide value");

    button.addEventListener("click", function () {
      const showing = input.type === "text";
      input.type = showing ? "password" : "text";
      button.textContent = showing ? "👁" : "🙈";
      button.title = showing ? "Show" : "Hide";
    });

    wrap.appendChild(button);
  }

  function setupEyeButtons() {
    // API keys and secrets
    document.querySelectorAll(
      '#uidKey, #topupKey, #topupSecret, #paymentKey,' +
      '#telegramOrderToken, #telegramMoneyToken'
    ).forEach(addEyeToggle);

    // Telegram Group IDs: hide by default and remove example text
    ['telegramOrderChatId', 'telegramMoneyChatId'].forEach(function (id) {
      const input = document.getElementById(id);
      if (input) {
        input.type = 'password';
        input.removeAttribute('placeholder');
        addEyeToggle(input);
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupEyeButtons);
  } else {
    setupEyeButtons();
  }
})();
</script>
</body>
