<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OXI ADMIN - Panel</title>
    <link rel="stylesheet" href="admin-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
    <style>
        .admin-badge { padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-left: 8px; font-weight: bold; }
        .super-admin { background: #ff4757; color: white; }
        .normal-admin { background: #2f3542; color: white; }
        .hidden { display: none !important; }
        .reason-input { width: 100%; margin-top: 10px; padding: 8px; border-radius: 5px; border: 1px solid #444; background: #222; color: white; display: none; }
        .ban-list-item { background: #1a1a1a; padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .ban-info h4 { margin: 0; color: #ff4757; }
        .ban-info p { margin: 5px 0 0; font-size: 13px; color: #aaa; }
        .unban-btn { background: #2ecc71; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .user-card { transition: transform 0.2s; user-select: none; }
        .user-card:active { transform: scale(0.98); }
        .search-box { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: white; margin-bottom: 20px; outline: none; }
        .search-box:focus { border-color: #7d5fff; }
        .tab-btn { position: relative; }
        .nav-links { gap: 10px; overflow-x: auto; padding-bottom: 5px; }
        .nav-links::-webkit-scrollbar { height: 0; }
        .filter-container { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-btn { background: #1a1a1a; border: 1px solid #333; color: white; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 13px; }
        .filter-btn.active { background: #7d5fff; border-color: #7d5fff; }
        
        /* Product UI Improvements */
        .category-item { background: #151515; border: 1px solid #222; border-radius: 15px; padding: 20px; margin-bottom: 30px; }
        .cat-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #222; }
        .cat-icon { width: 50px; height: 50px; border-radius: 10px; object-fit: cover; border: 1px solid #333; }
        .package-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .pkg-card { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 15px; }
        .pkg-info { margin-bottom: 15px; }
        .pkg-name { font-weight: bold; color: #fff; display: block; }
        .pkg-price { color: #2ecc71; font-size: 14px; }
        .cat-controls, .pkg-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .btn-sm { padding: 8px; font-size: 12px; border-radius: 6px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; color: white; }
        .btn-img { background: #3498db; }
        .btn-name { background: #34495e; }
        .btn-add { background: #2ecc71; }
        .btn-del { background: #e74c3c; }
        .btn-edit { background: #f39c12; }
        .btn-status { background: #9b59b6; }
        .toggle-on { background: #2ecc71; }
        .toggle-off { background: #95a5a6; }
    </style>
</head>
<body>
    <div class="admin-container">
        <header>
            <div class="logo">OXI <span>ADMIN</span></div>
            <div class="admin-profile">
                <span id="adminBadge" class="admin-badge"></span>
                <span id="adminEmail"></span>
                <button onclick="handleLogout()" class="logout-btn">Logout</button>
            </div>
        </header>

        <nav class="nav-links">
            <button class="tab-btn active" onclick="showTab('orders')"><i class="fas fa-shopping-cart"></i> Orders</button>
            <button class="tab-btn" onclick="showTab('products')"><i class="fas fa-box"></i> Products</button>
            <button class="tab-btn" onclick="showTab('users')"><i class="fas fa-users"></i> Users</button>
            <button class="tab-btn" onclick="showTab('banlist')"><i class="fas fa-user-slash"></i> Ban List</button>
            <button class="tab-btn" onclick="showTab('banners')"><i class="fas fa-image"></i> Banners</button>
            <button class="tab-btn" onclick="showTab('payments')" id="tab-payments"><i class="fas fa-university"></i> Payment</button>
            <button class="tab-btn" onclick="showTab('admins')" id="tab-admins"><i class="fas fa-user-shield"></i> Admins</button>
            <button class="tab-btn" onclick="window.location.href='api-settings.html'" id="tab-api"><i class="fas fa-code"></i> API</button>
        </nav>

        <!-- Orders Tab -->
        <div id="orders" class="tab-content active">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Orders</h3>
                    <p id="totalOrders">0</p>
                    <div class="filter-container" style="margin-top:10px;">
                        <button class="filter-btn active" onclick="setOrderFilter('all', this)">All</button>
                        <button class="filter-btn" onclick="setOrderFilter(0, this)">Today</button>
                        <button class="filter-btn" onclick="setOrderFilter(3, this)">3D</button>
                        <button class="filter-btn" onclick="setOrderFilter(7, this)">7D</button>
                        <button class="filter-btn" onclick="setOrderFilter(30, this)">30D</button>
                    </div>
                </div>
                <div class="stat-card">
                    <h3>Pending</h3>
                    <p id="pendingOrders">0</p>
                </div>
                <div class="stat-card">
                    <h3>Processing</h3>
                    <p id="processingOrders">0</p>
                </div>
                <div class="stat-card">
                    <h3>Completed</h3>
                    <p id="completedOrders">0</p>
                </div>
            </div>
            <input type="text" id="orderSearch" class="search-box" placeholder="Search by Order ID (e.g. #001)..." oninput="renderOrders()">
            <div id="ordersList" class="data-list"></div>
        </div>

        <!-- Products Tab -->
        <div id="products" class="tab-content">
            <div class="action-bar">
                <button onclick="addCategory()" class="add-btn"><i class="fas fa-plus"></i> New Category</button>
            </div>
            <div id="productList"></div>
        </div>

        <!-- Users Tab -->
        <div id="users" class="tab-content">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Users</h3>
                    <p id="totalUsers">0</p>
                </div>
                <div class="stat-card" id="fixIdCard">
                    <h3>System Tools</h3>
                    <button onclick="fixAllUserIDs()" class="add-btn" style="width:100%; margin-top:10px;">Fix User IDs</button>
                </div>
            </div>
            <input type="text" id="userSearch" class="search-box" placeholder="Search by name, email or ID..." oninput="renderUsers()">
            <div id="usersList" class="data-list"></div>
        </div>

        <!-- Ban List Tab -->
        <div id="banlist" class="tab-content">
            <input type="text" id="banSearch" class="search-box" placeholder="Search banned users..." oninput="renderBanList()">
            <div id="banListData"></div>
        </div>

        <!-- Banners Tab -->
        <div id="banners" class="tab-content">
            <div class="action-bar">
                <button onclick="addBanner()" class="add-btn"><i class="fas fa-plus"></i> Add Banner</button>
            </div>
            <div id="bannerList" class="data-list"></div>
        </div>

        <!-- Payments Tab -->
        <div id="payments" class="tab-content">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Pending Payments</h3>
                    <p id="pendingPaymentsCount">0</p>
                </div>
            </div>
            <div class="settings-card" style="margin-bottom: 20px;">
                <h3>Payment Numbers</h3>
                <div id="paymentSettings">
                    <p>Loading numbers...</p>
                </div>
                <button onclick="updatePaymentNumbers()" class="add-btn" style="margin-top:10px;">Update Numbers</button>
            </div>
            <div id="transactionsList" class="data-list"></div>
        </div>

        <!-- Admins Tab -->
        <div id="admins" class="tab-content">
            <div class="settings-card">
                <h3>Manage Admins</h3>
                <div class="add-admin-form">
                    <input type="email" id="newAdminEmail" placeholder="Admin Email">
                    <select id="adminLevel">
                        <option value="admin">Normal Admin</option>
                        <option value="super">Super Admin</option>
                    </select>
                    <button onclick="addAdmin()" class="add-btn">Add</button>
                </div>
                <div id="adminsList" class="data-list" style="margin-top:20px;"></div>
            </div>
        </div>
    </div>
        <script type="module">
        import { auth, database, ref, set, get, update, remove, onValue, runTransaction, emailToKey, checkAdminLevel, signOut, onAuthStateChanged } from './config.js';

        let currentAdminLevel = 'none';
        let orderFilter = 'all';

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const level = await checkAdminLevel(user.email);
                if (level === 'none') {
                    window.location.href = '../login.html';
                    return;
                }
                currentAdminLevel = level;
                document.getElementById('adminEmail').innerText = user.email;
                const badge = document.getElementById('adminBadge');
                badge.innerText = level === 'super' ? 'Super Admin' : 'Admin';
                badge.className = 'admin-badge ' + (level === 'super' ? 'super-admin' : 'normal-admin');
                
                if (level !== 'super') {
                    document.getElementById('tab-payments').classList.add('hidden');
                    document.getElementById('tab-admins').classList.add('hidden');
                    document.getElementById('tab-api').classList.add('hidden');
                    document.getElementById('fixIdCard').classList.add('hidden');
                }
                
                loadData();
            } else {
                window.location.href = '../login.html';
            }
        });

        window.handleLogout = () => {
            signOut(auth).then(() => {
                window.location.href = '../login.html';
            });
        };

        window.showTab = (tabId) => {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        };

        // Order Filter Logic
        window.setOrderFilter = (days, btn) => {
            orderFilter = days;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderOrders();
        };

        function loadData() {
            onValue(ref(database, 'orders'), () => renderOrders());
            onValue(ref(database, 'users'), () => { renderUsers(); renderBanList(); });
            onValue(ref(database, 'products'), () => renderProducts());
            onValue(ref(database, 'transactions'), () => renderTransactions());
            onValue(ref(database, 'banners'), () => renderBanners());
            onValue(ref(database, 'admins'), () => renderAdminsList());
            onValue(ref(database, 'superAdmins'), () => renderAdminsList());
            onValue(ref(database, 'paymentSettings'), (snapshot) => {
                const data = snapshot.val() || {};
                const container = document.getElementById('paymentSettings');
                container.innerHTML = `
                    <div style="margin-bottom:10px">
                        <label>Bkash:</label>
                        <input type="text" id="setBkash" value="${data.bkash || ''}" style="width:100%; padding:8px; background:#222; color:white; border:1px solid #444; border-radius:5px;">
                    </div>
                    <div style="margin-bottom:10px">
                        <label>Nagad:</label>
                        <input type="text" id="setNagad" value="${data.nagad || ''}" style="width:100%; padding:8px; background:#222; color:white; border:1px solid #444; border-radius:5px;">
                    </div>
                `;
            });
        }

        // --- PRODUCT MANAGEMENT (FIXED FOR SPECIAL CHARACTERS) ---
        window.renderProducts = async () => {
            const snap = await get(ref(database, 'products'));
            const products = snap.val() || {};
            const list = document.getElementById('productList');
            list.innerHTML = '';

            Object.keys(products).forEach(catId => {
                const cat = products[catId];
                const catEl = document.createElement('div');
                catEl.className = 'category-item';
                
                // Safe Cat ID for JS functions
                const safeCatId = catId.replace(/'/g, "\\'");
                
                let packagesHtml = '';
                if (cat.packages) {
                    Object.keys(cat.packages).forEach(pkgId => {
                        const pkg = cat.packages[pkgId];
                        const safePkgId = pkgId.replace(/'/g, "\\'");
                        packagesHtml += `
                            <div class="pkg-card">
                                <div class="pkg-info">
                                    <span class="pkg-name">${pkg.name}</span>
                                    <span class="pkg-price">${pkg.price} TK</span>
                                </div>
                                <div class="pkg-controls">
                                    <button class="btn-sm btn-edit" onclick="editPackage('${safeCatId}', '${safePkgId}')"><i class="fas fa-edit"></i> Edit</button>
                                    <button class="btn-sm btn-del" onclick="deletePackage('${safeCatId}', '${safePkgId}')"><i class="fas fa-trash"></i></button>
                                </div>
                            </div>
                        `;
                    });
                }

                catEl.innerHTML = `
                    <div class="cat-header">
                        <img src="${cat.image}" class="cat-icon" onerror="this.src='../assets/placeholder.png'">
                        <div style="flex-grow:1">
                            <h2 style="margin:0">${catId}</h2>
                            <small>${cat.packages ? Object.keys(cat.packages).length : 0} Packages</small>
                        </div>
                        <button class="btn-sm btn-status ${cat.status === 'OFF' ? 'toggle-off' : 'toggle-on'}" onclick="toggleCatStatus('${safeCatId}', '${cat.status}')">
                            ${cat.status === 'OFF' ? 'OFF' : 'ON'}
                        </button>
                    </div>
                    <div class="package-grid">${packagesHtml}</div>
                    <div class="cat-controls" style="margin-top:20px; grid-template-columns: repeat(4, 1fr);">
                        <button class="btn-sm btn-img" onclick="editCatImg('${safeCatId}')"><i class="fas fa-image"></i> Image</button>
                        <button class="btn-sm btn-name" onclick="renameCategory('${safeCatId}')"><i class="fas fa-pen"></i> Name</button>
                        <button class="btn-sm btn-add" onclick="addPackage('${safeCatId}')"><i class="fas fa-plus"></i> Package</button>
                        <button class="btn-sm btn-del" onclick="deleteCategory('${safeCatId}')"><i class="fas fa-trash"></i> Delete</button>
                    </div>
                `;
                list.appendChild(catEl);
            });
        };

        window.addCategory = async () => {
            const name = prompt("Category Name (e.g. Free Fire Diamond):");
            if (!name) return;
            await set(ref(database, 'products/' + name), {
                image: "https://placehold.co/100",
                status: "ON",
                packages: {}
            });
        };

        window.renameCategory = async (oldName) => {
            const newName = prompt("Enter New Category Name:", oldName);
            if (!newName || newName === oldName) return;
            const snap = await get(ref(database, 'products/' + oldName));
            if (snap.exists()) {
                await set(ref(database, 'products/' + newName), snap.val());
                await remove(ref(database, 'products/' + oldName));
            }
        };

        window.editCatImg = async (catId) => {
            const url = prompt("Enter Category Image URL:");
            if (url) await update(ref(database, `products/${catId}`), { image: url });
        };

        window.toggleCatStatus = async (catId, current) => {
            const next = current === 'OFF' ? 'ON' : 'OFF';
            await update(ref(database, `products/${catId}`), { status: next });
        };

        window.deleteCategory = async (catId) => {
            if (confirm(`Delete entire category "${catId}"?`)) {
                await remove(ref(database, 'products/' + catId));
            }
        };

        window.addPackage = async (catId) => {
            const name = prompt("Package Name (e.g. 100 Diamonds):");
            const price = prompt("Price (TK):");
            if (name && price) {
                const pkgId = Date.now().toString();
                await set(ref(database, `products/${catId}/packages/${pkgId}`), {
                    name: name,
                    price: parseFloat(price)
                });
            }
        };

        window.editPackage = async (catId, pkgId) => {
            const snap = await get(ref(database, `products/${catId}/packages/${pkgId}`));
            const pkg = snap.val();
            const name = prompt("New Name:", pkg.name);
            const price = prompt("New Price:", pkg.price);
            if (name && price) {
                await update(ref(database, `products/${catId}/packages/${pkgId}`), {
                    name: name,
                    price: parseFloat(price)
                });
            }
        };

        window.deletePackage = async (catId, pkgId) => {
            if (confirm("Delete this package?")) {
                await remove(ref(database, `products/${catId}/packages/${pkgId}`));
            }
        };

        // --- ORDER MANAGEMENT ---
        window.renderOrders = async () => {
            const snap = await get(ref(database, 'orders'));
            const orders = snap.val() || {};
            const search = document.getElementById('orderSearch').value.toLowerCase();
            const list = document.getElementById('ordersList');
            list.innerHTML = '';

            let total = 0, pending = 0, processing = 0, completed = 0;
            const now = Date.now();

            const sortedKeys = Object.keys(orders).reverse();
            
            sortedKeys.forEach(key => {
                const order = orders[key];
                const orderTime = order.timestamp;
                const orderIdStr = '#' + String(order.orderNumber || 0).padStart(3, '0');
                
                // Time Filter
                if (orderFilter !== 'all') {
                    const diffDays = (now - orderTime) / (1000 * 60 * 60 * 24);
                    if (diffDays > orderFilter) return;
                }

                // Search Filter
                if (search && !orderIdStr.toLowerCase().includes(search)) return;

                total++;
                if (order.status === 'Pending') pending++;
                if (order.status === 'Processing') processing++;
                if (order.status === 'Completed') completed++;

                const item = document.createElement('div');
                item.className = 'data-item';
                item.innerHTML = `
                    <div class="order-info">
                        <strong>${orderIdStr} - ${order.productName} (${order.packageName})</strong>
                        <p>Player ID: ${order.playerId} | Amount: ${order.price} TK</p>
                        <p>User: ${order.userEmail} | ${new Date(order.timestamp).toLocaleString()}</p>
                        ${order.reason ? `<p style="color:#ff4757">Reason: ${order.reason}</p>` : ''}
                    </div>
                    <div class="order-status">
                        <span class="status-badge status-${order.status.toLowerCase()}">${order.status}</span>
                        <div class="order-actions" style="margin-top:10px">
                            ${order.status === 'Pending' ? `<button onclick="updateOrderStatus('${key}', 'Processing')" class="btn-process">Process</button>` : ''}
                            ${order.status === 'Processing' ? `<button onclick="updateOrderStatus('${key}', 'Completed')" class="btn-complete">Complete</button>` : ''}
                            ${(order.status === 'Pending' || order.status === 'Processing') ? `
                                <button onclick="showRejectBox('${key}')" class="btn-reject">Reject</button>
                                <div id="reject-box-${key}" class="reason-input">
                                    <input type="text" id="reason-${key}" placeholder="Reason (Optional)">
                                    <button onclick="confirmReject('${key}', '${order.userId}', ${order.price})" style="background:#ff4757; color:white; border:none; padding:5px; margin-top:5px; width:100%; border-radius:4px;">Confirm Reject</button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
                list.appendChild(item);
            });

            document.getElementById('totalOrders').innerText = total;
            document.getElementById('pendingOrders').innerText = pending;
            document.getElementById('processingOrders').innerText = processing;
            document.getElementById('completedOrders').innerText = completed;
        };

        window.updateOrderStatus = async (orderId, status) => {
            await update(ref(database, 'orders/' + orderId), { status: status });
        };

        window.showRejectBox = (id) => {
            const box = document.getElementById('reject-box-' + id);
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
        };

        window.confirmReject = async (orderId, userId, amount) => {
            const reason = document.getElementById('reason-' + orderId).value || "Order Rejected";
            
            // Refund Wallet
            const userRef = ref(database, `users/${userId}/wallet`);
            await runTransaction(userRef, (current) => (current || 0) + amount);
            
            // Update Order
            await update(ref(database, 'orders/' + orderId), { 
                status: 'Rejected',
                reason: reason
            });
        };

        // --- USER & BAN SYSTEM ---
        window.renderUsers = async () => {
            const snap = await get(ref(database, 'users'));
            const users = snap.val() || {};
            const search = document.getElementById('userSearch').value.toLowerCase();
            const list = document.getElementById('usersList');
            list.innerHTML = '';
            
            let count = 0;
            Object.keys(users).forEach(uid => {
                const user = users[uid];
                const matchesSearch = user.name?.toLowerCase().includes(search) || 
                                    user.email?.toLowerCase().includes(search) || 
                                    user.numericId?.toString().includes(search);

                if (!matchesSearch) return;
                count++;

                const item = document.createElement('div');
                item.className = 'data-item user-card';
                
                // Long Press to Ban
                let pressTimer;
                item.onmousedown = () => { pressTimer = window.setTimeout(() => banUser(uid, user.email), 1000); };
                item.onmouseup = () => clearTimeout(pressTimer);
                item.ontouchstart = () => { pressTimer = window.setTimeout(() => banUser(uid, user.email), 1000); };
                item.ontouchend = () => clearTimeout(pressTimer);

                item.innerHTML = `
                    <div class="user-info">
                        <strong>${user.name || 'No Name'}</strong>
                        <p>${user.email} | ID: ${user.numericId || 'N/A'}</p>
                        <p>Wallet: ${user.wallet || 0} TK | Spend: ${user.totalSpend || 0} TK</p>
                    </div>
                    ${currentAdminLevel === 'super' ? `
                    <div class="wallet-actions">
                        <button onclick="adjustWallet('${uid}', 'add')" style="background:#2ecc71">+</button>
                        <button onclick="adjustWallet('${uid}', 'sub')" style="background:#e74c3c">-</button>
                    </div>
                    ` : ''}
                `;
                list.appendChild(item);
            });
            document.getElementById('totalUsers').innerText = count;
        };

        window.banUser = async (uid, email) => {
            if (confirm(`Do you want to BAN user: ${email}?`)) {
                await set(ref(database, 'bannedUsers/' + uid), true);
                alert("User Banned!");
            }
        };

        window.renderBanList = async () => {
            const banSnap = await get(ref(database, 'bannedUsers'));
            const banned = banSnap.val() || {};
            const usersSnap = await get(ref(database, 'users'));
            const allUsers = usersSnap.val() || {};
            const search = document.getElementById('banSearch').value.toLowerCase();
            const container = document.getElementById('banListData');
            container.innerHTML = '';

            Object.keys(banned).forEach(uid => {
                const user = allUsers[uid] || { name: 'Unknown', email: 'N/A' };
                if (search && !user.email.toLowerCase().includes(search)) return;

                const div = document.createElement('div');
                div.className = 'ban-list-item';
                div.innerHTML = `
                    <div class="ban-info">
                        <h4>${user.name}</h4>
                        <p>${user.email}</p>
                    </div>
                    <button class="unban-btn" onclick="unbanUser('${uid}')">Unban</button>
                `;
                container.appendChild(div);
            });
        };

        window.unbanUser = async (uid) => {
            if (confirm("Unban this user?")) {
                await remove(ref(database, 'bannedUsers/' + uid));
            }
        };

        window.adjustWallet = async (uid, type) => {
            const amount = prompt("Enter amount:");
            if (!amount || isNaN(amount)) return;
            const val = parseFloat(amount);
            const userRef = ref(database, `users/${uid}/wallet`);
            await runTransaction(userRef, (current) => {
                return type === 'add' ? (current || 0) + val : (current || 0) - val;
            });
        };

        // --- TRANSACTIONS ---
        window.renderTransactions = async () => {
            const snap = await get(ref(database, 'transactions'));
            const trxs = snap.val() || {};
            const list = document.getElementById('transactionsList');
            list.innerHTML = '';
            
            let pending = 0;
            Object.keys(trxs).reverse().forEach(key => {
                const trx = trxs[key];
                if (trx.status === 'Pending') pending++;
                
                const item = document.createElement('div');
                item.className = 'data-item';
                item.innerHTML = `
                    <div class="order-info">
                        <strong>Add Money: ${trx.amount} TK (${trx.method})</strong>
                        <p>TrxID: ${trx.trxId} | Sender: ${trx.sender}</p>
                        <p>User: ${trx.userEmail} | ${new Date(trx.timestamp).toLocaleString()}</p>
                    </div>
                    <div class="order-status">
                        <span class="status-badge status-${trx.status.toLowerCase()}">${trx.status}</span>
                        ${trx.status === 'Pending' ? `
                            <div style="margin-top:10px">
                                <button onclick="approveTrx('${key}', '${trx.userId}', ${trx.amount})" class="btn-complete">Approve</button>
                                <button onclick="updateTrxStatus('${key}', 'Rejected')" class="btn-reject">Reject</button>
                            </div>
                        ` : ''}
                    </div>
                `;
                list.appendChild(item);
            });
            document.getElementById('pendingPaymentsCount').innerText = pending;
        };

        window.approveTrx = async (trxKey, userId, amount) => {
            await runTransaction(ref(database, `users/${userId}/wallet`), (current) => (current || 0) + amount);
            await update(ref(database, 'transactions/' + trxKey), { status: 'Approved' });
        };

        window.updateTrxStatus = async (key, status) => {
            await update(ref(database, 'transactions/' + key), { status: status });
        };

        // --- BANNERS ---
        window.renderBanners = async () => {
            const snap = await get(ref(database, 'banners'));
            const banners = snap.val() || {};
            const list = document.getElementById('bannerList');
            list.innerHTML = '';

            Object.keys(banners).forEach(id => {
                const b = banners[id];
                const item = document.createElement('div');
                item.className = 'data-item';
                item.innerHTML = `
                    <img src="${b.image}" style="width:150px; border-radius:8px; margin-right:15px">
                    <div style="flex-grow:1">
                        <p>Link: ${b.link || 'No Link'}</p>
                    </div>
                    <button onclick="deleteBanner('${id}')" class="btn-reject">Delete</button>
                `;
                list.appendChild(item);
            });
        };

        window.addBanner = async () => {
            const url = prompt("Banner Image URL:");
            const link = prompt("Click Link (Optional):");
            if (url) {
                await push(ref(database, 'banners'), { image: url, link: link || "" });
            }
        };

        window.deleteBanner = async (id) => {
            if (confirm("Delete banner?")) await remove(ref(database, 'banners/' + id));
        };

        // --- ADMINS ---
        window.renderAdminsList = async () => {
            const list = document.getElementById('adminsList');
            list.innerHTML = '';
            
            const supers = (await get(ref(database, 'superAdmins'))).val() || {};
            const normals = (await get(ref(database, 'admins'))).val() || {};

            const addAdminItem = (emailKey, type) => {
                const email = emailKey.replace(/,/g, '.');
                const div = document.createElement('div');
                div.className = 'data-item';
                div.innerHTML = `
                    <span>${email} <strong>(${type})</strong></span>
                    <button onclick="removeAdmin('${emailKey}', '${type}')" class="btn-reject">Remove</button>
                `;
                list.appendChild(div);
            };

            Object.keys(supers).forEach(k => addAdminItem(k, 'super'));
            Object.keys(normals).forEach(k => addAdminItem(k, 'admin'));
        };

        window.addAdmin = async () => {
            const email = document.getElementById('newAdminEmail').value.trim();
            const level = document.getElementById('adminLevel').value;
            if (!email) return;
            const key = emailToKey(email);
            const path = level === 'super' ? 'superAdmins/' : 'admins/';
            await set(ref(database, path + key), true);
            alert("Admin Added!");
        };

        window.removeAdmin = async (key, type) => {
            if (confirm("Remove this admin?")) {
                const path = type === 'super' ? 'superAdmins/' : 'admins/';
                await remove(ref(database, path + key));
            }
        };

        window.updatePaymentNumbers = async () => {
            const bkash = document.getElementById('setBkash').value;
            const nagad = document.getElementById('setNagad').value;
            await update(ref(database, 'paymentSettings'), { bkash, nagad });
            alert("Numbers Updated!");
        };

        window.fixAllUserIDs = async () => {
            if (!confirm("This will fix all users with missing Numeric IDs. Continue?")) return;
            const snap = await get(ref(database, 'users'));
            const users = snap.val();
            for (let uid in users) {
                if (!users[uid].numericId) {
                    let num = 0;
                    for (let i = 0; i < uid.length; i++) num += uid.charCodeAt(i) * (i + 1);
                    const newId = String(100000 + (num % 900000));
                    await update(ref(database, `users/${uid}`), { numericId: newId });
                }
            }
            alert("All IDs Fixed!");
        };
    </script>
</body>
</html>
