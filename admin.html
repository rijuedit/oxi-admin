<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OXI ADMIN - Panel</title>
    <link rel="stylesheet" href="admin-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
    <style>
        /* CSS FIXES */
        .tab-content { display: none; padding: 20px 0; }
        .tab-content.active { display: block; }
        .admin-badge { padding: 4px 10px; border-radius: 5px; font-size: 12px; margin-right: 10px; font-weight: bold; }
        .super-admin { background: #ff4757; color: white; }
        .normal-admin { background: #2f3542; color: white; }
        .hidden { display: none !important; }
        
        /* Product UI Fix */
        .category-item { background: #111; border: 1px solid #333; border-radius: 12px; padding: 20px; margin-bottom: 25px; }
        .cat-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 15px; }
        .cat-icon { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; }
        .package-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .pkg-card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 15px; position: relative; }
        .pkg-name { display: block; font-weight: bold; margin-bottom: 5px; }
        .pkg-price { color: #2ecc71; font-size: 14px; }
        .cat-controls { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
        .btn-sm { padding: 8px 12px; font-size: 12px; border-radius: 5px; border: none; cursor: pointer; color: white; display: flex; align-items: center; gap: 5px; }
        
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; text-transform: uppercase; }
        .status-pending { background: #f1c40f; color: #000; }
        .status-processing { background: #3498db; color: #fff; }
        .status-completed { background: #2ecc71; color: #fff; }
        .status-rejected { background: #e74c3c; color: #fff; }

        .search-box { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: white; margin-bottom: 20px; }
        .filter-btn { background: #1a1a1a; border: 1px solid #333; color: white; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-right: 5px; }
        .filter-btn.active { background: #7d5fff; border-color: #7d5fff; }
    </style>
</head>
<body>
    <div class="admin-container">
        <header>
            <div class="logo">OXI <span>ADMIN</span></div>
            <div class="admin-profile">
                <span id="adminBadge" class="admin-badge"></span>
                <span id="adminEmail"></span>
                <button onclick="handleLogout()" class="logout-btn">Logout</button>
            </div>
        </header>

        <nav class="nav-links">
            <button class="tab-btn active" onclick="showTab('orders')">Orders</button>
            <button class="tab-btn" onclick="showTab('products')">Products</button>
            <button class="tab-btn" onclick="showTab('users')">Users</button>
            <button class="tab-btn" onclick="showTab('banlist')">Ban List</button>
            <button class="tab-btn" onclick="showTab('banners')">Banners</button>
            <button class="tab-btn" onclick="showTab('payments')" id="tab-payments">Payment</button>
            <button class="tab-btn" onclick="showTab('admins')" id="tab-admins">Admins</button>
            <button class="tab-btn" onclick="window.location.href='api-settings.html'" id="tab-api">API</button>
        </nav>

        <!-- Orders Tab -->
        <div id="orders" class="tab-content active">
            <div class="stats-grid">
                <div class="stat-card"><h3>Total Orders</h3><p id="totalOrders">0</p>
                    <div style="margin-top:10px;">
                        <button class="filter-btn active" onclick="setOrderFilter('all', this)">All</button>
                        <button class="filter-btn" onclick="setOrderFilter(0, this)">Today</button>
                        <button class="filter-btn" onclick="setOrderFilter(7, this)">7D</button>
                    </div>
                </div>
                <div class="stat-card"><h3>Pending</h3><p id="pendingOrders">0</p></div>
                <div class="stat-card"><h3>Completed</h3><p id="completedOrders">0</p></div>
            </div>
            <input type="text" id="orderSearch" class="search-box" placeholder="Search by #001..." oninput="renderOrders()">
            <div id="ordersList" class="data-list"></div>
        </div>

        <!-- Products Tab -->
        <div id="products" class="tab-content">
            <div class="action-bar" style="margin-bottom:20px">
                <button onclick="addCategory()" class="add-btn"><i class="fas fa-plus"></i> New Category</button>
            </div>
            <div id="productList"></div>
        </div>

        <!-- Users Tab -->
        <div id="users" class="tab-content">
            <input type="text" id="userSearch" class="search-box" placeholder="Search users..." oninput="renderUsers()">
            <div id="fixIdCard" style="margin-bottom:20px"><button onclick="fixAllUserIDs()" class="add-btn">Fix IDs</button></div>
            <div id="usersList" class="data-list"></div>
        </div>

        <!-- Ban List Tab -->
        <div id="banlist" class="tab-content">
            <div id="banListData" class="data-list"></div>
        </div>

        <!-- Banners Tab -->
        <div id="banners" class="tab-content">
            <button onclick="addBanner()" class="add-btn" style="margin-bottom:20px">Add Banner</button>
            <div id="bannerList" class="data-list"></div>
        </div>

        <!-- Payments Tab -->
        <div id="payments" class="tab-content">
            <div id="paymentSettings" class="settings-card" style="margin-bottom:20px"></div>
            <button onclick="updatePaymentNumbers()" class="add-btn">Update Numbers</button>
            <div id="transactionsList" class="data-list" style="margin-top:20px"></div>
        </div>

        <!-- Admins Tab -->
        <div id="admins" class="tab-content">
            <div class="settings-card">
                <input type="email" id="newAdminEmail" placeholder="Admin Email" style="padding:8px; border-radius:5px; border:1px solid #333; background:#111; color:white;">
                <select id="adminLevel" style="padding:8px; border-radius:5px;">
                    <option value="admin">Normal Admin</option>
                    <option value="super">Super Admin</option>
                </select>
                <button onclick="addAdmin()" class="add-btn">Add Admin</button>
                <div id="adminsList" class="data-list" style="margin-top:20px"></div>
            </div>
        </div>
    </div>    
    <script type="module">
        import { auth, database, ref, set, get, update, remove, onValue, runTransaction, emailToKey, checkAdminLevel, signOut, onAuthStateChanged } from './config.js';

        let currentAdminLevel = 'none';
        let orderFilter = 'all';

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const level = await checkAdminLevel(user.email);
                if (level === 'none') { window.location.href = '../login.html'; return; }
                currentAdminLevel = level;
                document.getElementById('adminEmail').innerText = user.email;
                const badge = document.getElementById('adminBadge');
                badge.innerText = level === 'super' ? 'Super Admin' : 'Admin';
                badge.className = 'admin-badge ' + (level === 'super' ? 'super-admin' : 'normal-admin');
                
                if (level !== 'super') {
                    document.getElementById('tab-payments').classList.add('hidden');
                    document.getElementById('tab-admins').classList.add('hidden');
                    document.getElementById('tab-api').classList.add('hidden');
                    document.getElementById('fixIdCard').classList.add('hidden');
                }
                loadData();
            } else { window.location.href = '../login.html'; }
        });

        window.showTab = (tabId) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        };

        function loadData() {
            onValue(ref(database, 'orders'), () => renderOrders());
            onValue(ref(database, 'products'), () => renderProducts());
            onValue(ref(database, 'users'), () => { renderUsers(); renderBanList(); });
            onValue(ref(database, 'transactions'), () => renderTransactions());
            onValue(ref(database, 'banners'), () => renderBanners());
            onValue(ref(database, 'paymentSettings'), (s) => {
                const d = s.val() || {};
                document.getElementById('paymentSettings').innerHTML = `
                    <label>Bkash:</label><input type="text" id="setBkash" value="${d.bkash||''}" style="width:100%;margin:5px 0 15px;padding:8px;background:#222;color:white;border:1px solid #444;">
                    <label>Nagad:</label><input type="text" id="setNagad" value="${d.nagad||''}" style="width:100%;margin:5px 0;padding:8px;background:#222;color:white;border:1px solid #444;">
                `;
            });
            onValue(ref(database, 'admins'), () => renderAdmins());
            onValue(ref(database, 'superAdmins'), () => renderAdmins());
        }

        // --- FIXED PRODUCT RENDER ---
        window.renderProducts = async () => {
            const snap = await get(ref(database, 'products'));
            const products = snap.val() || {};
            const list = document.getElementById('productList');
            list.innerHTML = '';

            Object.keys(products).forEach(catId => {
                const cat = products[catId];
                const safeCatId = catId.replace(/'/g, "\\'");
                const item = document.createElement('div');
                item.className = 'category-item';
                
                let pkgs = '';
                if (cat.packages) {
                    Object.keys(cat.packages).forEach(pid => {
                        const p = cat.packages[pid];
                        pkgs += `
                            <div class="pkg-card">
                                <span class="pkg-name">${p.name}</span>
                                <span class="pkg-price">${p.price} TK</span>
                                <div style="margin-top:10px;display:flex;gap:5px;">
                                    <button class="btn-sm" style="background:#f39c12" onclick="editPackage('${safeCatId}','${pid}')">Edit</button>
                                    <button class="btn-sm" style="background:#e74c3c" onclick="deletePackage('${safeCatId}','${pid}')">Del</button>
                                </div>
                            </div>
                        `;
                    });
                }

                item.innerHTML = `
                    <div class="cat-header">
                        <img src="${cat.image}" class="cat-icon" onerror="this.src='../assets/placeholder.png'">
                        <div style="flex-grow:1"><h3>${catId}</h3><small>${cat.status}</small></div>
                        <button class="btn-sm" style="background:${cat.status==='ON'?'#2ecc71':'#95a5a6'}" onclick="toggleCat('${safeCatId}','${cat.status}')">${cat.status}</button>
                    </div>
                    <div class="package-grid">${pkgs}</div>
                    <div class="cat-controls">
                        <button class="btn-sm" style="background:#3498db" onclick="editCatImg('${safeCatId}')">Image</button>
                        <button class="btn-sm" style="background:#2ecc71" onclick="addPackage('${safeCatId}')">Add Pkg</button>
                        <button class="btn-sm" style="background:#e74c3c" onclick="deleteCat('${safeCatId}')">Delete Cat</button>
                    </div>
                `;
                list.appendChild(item);
            });
        };

        // Functions for products
        window.toggleCat = (id, s) => update(ref(database, `products/${id}`), {status: s==='ON'?'OFF':'ON'});
        window.editCatImg = (id) => { const u = prompt("URL:"); if(u) update(ref(database, `products/${id}`), {image:u}); };
        window.addPackage = (id) => { 
            const n = prompt("Name:"); const p = prompt("Price:"); 
            if(n && p) push(ref(database, `products/${id}/packages`), {name:n, price:parseFloat(p)});
        };
        window.deleteCat = (id) => { if(confirm("Delete?")) remove(ref(database, `products/${id}`)); };
        window.deletePackage = (cid, pid) => { if(confirm("Delete?")) remove(ref(database, `products/${cid}/packages/${pid}`)); };

        // --- ORDER RENDER (FIXED DATE/ID) ---
        window.renderOrders = async () => {
            const snap = await get(ref(database, 'orders'));
            const orders = snap.val() || {};
            const search = document.getElementById('orderSearch').value.toLowerCase();
            const list = document.getElementById('ordersList');
            list.innerHTML = '';

            let t=0, p=0, c=0;
            Object.keys(orders).reverse().forEach(key => {
                const o = orders[key];
                const oid = o.orderNumber ? '#' + String(o.orderNumber).padStart(3, '0') : '#OLD';
                const date = o.timestamp ? new Date(o.timestamp).toLocaleString() : 'N/A';
                
                if (search && !oid.toLowerCase().includes(search)) return;
                t++; if(o.status==='Pending') p++; if(o.status==='Completed') c++;

                const div = document.createElement('div');
                div.className = 'data-item';
                div.innerHTML = `
                    <div class="order-info">
                        <strong>${oid} - ${o.productName} (${o.packageName})</strong>
                        <p>ID: ${o.playerId} | Price: ${o.price} TK</p>
                        <small>${o.userEmail} | ${date}</small>
                    </div>
                    <div class="order-status">
                        <span class="status-badge status-${o.status.toLowerCase()}">${o.status}</span>
                        <div style="margin-top:8px">
                            ${o.status==='Pending'?`<button onclick="updateStatus('${key}','Processing')" class="btn-process">Process</button>`:''}
                            ${o.status==='Processing'?`<button onclick="updateStatus('${key}','Completed')" class="btn-complete">Complete</button>`:''}
                            ${o.status!=='Completed' && o.status!=='Rejected'?`<button onclick="rejectOrder('${key}',${o.price},'${o.userId}')" class="btn-reject">Reject</button>`:''}
                        </div>
                    </div>
                `;
                list.appendChild(div);
            });
            document.getElementById('totalOrders').innerText = t;
            document.getElementById('pendingOrders').innerText = p;
            document.getElementById('completedOrders').innerText = c;
        };

        window.updateStatus = (id, s) => update(ref(database, `orders/${id}`), {status:s});
        window.rejectOrder = async (id, amt, uid) => {
            const r = prompt("Reason:");
            await runTransaction(ref(database, `users/${uid}/wallet`), (curr) => (curr||0) + amt);
            await update(ref(database, `orders/${id}`), {status:'Rejected', reason: r||'Rejected'});
        };

        // Rest of the functions (Users, Banners, Admins, etc.) follow similar pattern
        window.handleLogout = () => signOut(auth).then(() => window.location.href='../login.html');
        window.addCategory = () => { const n = prompt("Name:"); if(n) set(ref(database, `products/${n}`), {image:'', status:'ON'}); };
        
        window.renderUsers = async () => {
            const snap = await get(ref(database, 'users'));
            const users = snap.val() || {};
            const list = document.getElementById('usersList'); list.innerHTML = '';
            Object.keys(users).forEach(uid => {
                const u = users[uid];
                const div = document.createElement('div');
                div.className = 'data-item';
                div.innerHTML = `<div><strong>${u.name}</strong><p>${u.email} | Wallet: ${u.wallet||0}</p></div>`;
                list.appendChild(div);
            });
        };
    </script>
</body>
</html>
