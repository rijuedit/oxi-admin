<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - OXI TOP UP</title>
    <link rel="stylesheet" href="admin-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="home-body">

    <!-- PIN Lock -->
    <div id="pinScreen" class="pin-screen">
        <div class="pin-container">
            <div class="pin-logo">🔐</div>
            <h2>Admin Panel</h2>
            <p>Enter Your PIN</p>
            <div class="pin-display" id="pinDisplay"></div>
            <div id="pinError" class="pin-error" style="display:none;">❌ Wrong PIN!</div>
            <div class="pin-keypad">
                <button onclick="addDigit('1')">1</button>
                <button onclick="addDigit('2')">2</button>
                <button onclick="addDigit('3')">3</button>
                <button onclick="addDigit('4')">4</button>
                <button onclick="addDigit('5')">5</button>
                <button onclick="addDigit('6')">6</button>
                <button onclick="addDigit('7')">7</button>
                <button onclick="addDigit('8')">8</button>
                <button onclick="addDigit('9')">9</button>
                <button onclick="clearPin()" class="pin-clear">⌫</button>
                <button onclick="addDigit('0')">0</button>
                <button onclick="checkPin()" class="pin-submit">✓</button>
            </div>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard" style="display:none;">
        
        <nav class="home-navbar">
            <div class="home-logo">OXI <span>ADMIN</span></div>
            <div class="home-nav-right">
                <span class="admin-badge">🔐 Admin Mode</span>
                <button class="btn-logout-admin" onclick="logoutAdmin()">Logout</button>
            </div>
        </nav>

        <div class="dash-container">

            <!-- Stats -->
            <div class="stats-grid-new">
                <div class="stat-card-new">
                    <div class="stat-icon">👥</div>
                    <h4>Total Users</h4>
                    <p id="totalUsers">0</p>
                </div>
                <div class="stat-card-new">
                    <div class="stat-icon">📦</div>
                    <h4>Total Orders</h4>
                    <p id="totalOrdersCount">0</p>
                </div>
                <div class="stat-card-new">
                    <div class="stat-icon">💰</div>
                    <h4>Pending Add Money</h4>
                    <p id="pendingCount">0</p>
                </div>
            </div>

            <!-- Tabs -->
            <div class="admin-tabs">
                <button class="tab-btn active" onclick="showTab('transactions', event)">💳 Add Money</button>
                <button class="tab-btn" onclick="showTab('orders', event)">📦 Orders</button>
                <button class="tab-btn" onclick="showTab('users', event)">👥 Users</button>
                <button class="tab-btn" onclick="showTab('products', event)">🎮 Products</button>
            </div>

            <!-- Transactions Tab -->
            <div id="transactionsTab" class="tab-content">
                <div class="section-box">
                    <h3>💳 Add Money Requests</h3>
                    <div id="transactionsList"></div>
                </div>
            </div>

            <!-- Orders Tab -->
            <div id="ordersTab" class="tab-content" style="display:none;">
                <div class="section-box">
                    <h3>📦 All Orders</h3>
                    <div id="ordersList"></div>
                </div>
            </div>

            <!-- Users Tab -->
            <div id="usersTab" class="tab-content" style="display:none;">
                <div class="section-box">
                    <h3>👥 All Users</h3>
                    <div id="usersList"></div>
                </div>
            </div>

            <!-- Products Tab -->
            <div id="productsTab" class="tab-content" style="display:none;">
                <div class="section-box">
                    <h3>🎮 Product Management</h3>
                    <p style="color:#a0a0c0;margin-bottom:15px;font-size:13px;">💡 Click on any product to see packages | Upload image to <a href="https://postimages.org" target="_blank" style="color:#8b00ff;">postimages.org</a> and paste DIRECT LINK</p>
                    <div id="productsList"></div>
                </div>
            </div>

        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module">
        import { database, ref, get, set, push, onValue, update, ADMIN_PIN } from './config.js';

        let currentPin = '';
        let wrongAttempts = parseInt(localStorage.getItem('wrongAttempts') || '0');
        let lockUntil = parseInt(localStorage.getItem('lockUntil') || '0');

        function checkLock() {
            if (Date.now() < lockUntil) {
                const minutes = Math.ceil((lockUntil - Date.now()) / 60000);
                document.getElementById('pinDisplay').textContent = '🔒 LOCKED';
                document.getElementById('pinError').style.display = 'block';
                document.getElementById('pinError').textContent = '🔒 Locked! Wait ' + minutes + ' minutes';
                document.querySelectorAll('.pin-keypad button').forEach(btn => btn.disabled = true);
                return true;
            }
            return false;
        }
        checkLock();

        window.addDigit = function(digit) {
            if (currentPin.length < 15) { currentPin += digit; updatePinDisplay(); }
        };

        window.clearPin = function() {
            currentPin = currentPin.slice(0, -1); updatePinDisplay();
        };

        function updatePinDisplay() {
            document.getElementById('pinDisplay').textContent = '•'.repeat(currentPin.length);
            document.getElementById('pinError').style.display = 'none';
        }

        window.checkPin = function() {
            if (checkLock()) return;
            if (currentPin === ADMIN_PIN) {
                localStorage.removeItem('wrongAttempts');
                localStorage.removeItem('lockUntil');
                document.getElementById('pinScreen').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                sessionStorage.setItem('adminLoggedIn', 'true');
                loadData();
            } else {
                wrongAttempts++;
                localStorage.setItem('wrongAttempts', wrongAttempts);
                if (wrongAttempts >= 3) {
                    lockUntil = Date.now() + (5 * 60 * 1000);
                    localStorage.setItem('lockUntil', lockUntil);
                    localStorage.setItem('wrongAttempts', '0');
                    wrongAttempts = 0;
                    document.getElementById('pinError').textContent = '🔒 Locked for 5 minutes!';
                    document.querySelectorAll('.pin-keypad button').forEach(btn => btn.disabled = true);
                } else {
                    document.getElementById('pinError').textContent = '❌ Wrong PIN! (' + (3 - wrongAttempts) + ' attempts left)';
                }
                document.getElementById('pinError').style.display = 'block';
                currentPin = '';
                updatePinDisplay();
            }
        };

        window.logoutAdmin = function() {
            sessionStorage.removeItem('adminLoggedIn');
            location.reload();
        };

        window.showTab = function(tab, event) {
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab + 'Tab').style.display = 'block';
            if (event) event.target.classList.add('active');
        };

        window.showToast = function(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        };

        window.approveTransaction = async function(trxId, userId, amount) {
            if (!confirm('Approve ৳ ' + amount + ' for this user?')) return;
            const userRef = ref(database, 'users/' + userId);
            const snapshot = await get(userRef);
            if (snapshot.exists()) {
                const userData = snapshot.val();
                const newWallet = (userData.wallet || 0) + parseInt(amount);
                await update(userRef, { wallet: newWallet });
                await update(ref(database, 'transactions/' + trxId), { status: 'Approved', approvedDate: new Date().toISOString() });
                showToast('✅ Approved! ৳ ' + amount + ' added');
                loadData();
            }
        };

        window.rejectTransaction = async function(trxId) {
            if (!confirm('Reject this payment request?')) return;
            await update(ref(database, 'transactions/' + trxId), { status: 'Rejected', rejectedDate: new Date().toISOString() });
            showToast('❌ Payment Rejected');
            loadData();
        };

        window.updateOrderStatus = async function(orderId, status) {
            await update(ref(database, 'orders/' + orderId), { status: status, updatedDate: new Date().toISOString() });
            showToast('✅ Order ' + status);
            loadData();
        };

        window.toggleProductStock = async function(productKey, currentStock) {
            const newStock = currentStock === 'in' ? 'out' : 'in';
            await update(ref(database, 'products/' + productKey), { stock: newStock });
            showToast('✅ Product ' + (newStock === 'in' ? 'Stock In' : 'Stock Out'));
            loadProducts();
        };

        window.togglePackageStock = async function(productKey, pkgKey, currentStock) {
            const newStock = currentStock === 'in' ? 'out' : 'in';
            await update(ref(database, 'products/' + productKey + '/packages/' + pkgKey), { stock: newStock });
            showToast('✅ Package ' + (newStock === 'in' ? 'Stock In' : 'Stock Out'));
            loadProducts();
        };

        window.editPrice = async function(productKey, pkgKey, currentPrice, pkgName) {
            const newPrice = prompt('Edit price for "' + pkgName + '"\nCurrent: ৳ ' + currentPrice, currentPrice);
            if (newPrice === null || newPrice === '') return;
            const price = parseInt(newPrice);
            if (isNaN(price) || price < 1) {
                alert('Invalid price!');
                return;
            }
            await update(ref(database, 'products/' + productKey + '/packages/' + pkgKey), { price: price });
            showToast('✅ Price updated to ৳ ' + price);
            loadProducts();
        };

        window.editProductImage = async function(productKey, currentImage, productName) {
            const newImage = prompt('📸 Change image for "' + productName + '"\n\n💡 Upload image to postimages.org\nCopy the DIRECT LINK and paste here:', currentImage);
            if (newImage === null || newImage === '') return;
            
            if (!newImage.startsWith('http')) {
                alert('❌ Invalid URL! Please paste a valid image URL (starting with http)');
                return;
            }

            await update(ref(database, 'products/' + productKey), { image: newImage });
            showToast('✅ Image updated successfully!');
            loadProducts();
        };

        window.editProductName = async function(productKey, currentName) {
            const newName = prompt('✏️ Change product name\n\nCurrent name:', currentName);
            if (newName === null || newName === '' || newName === currentName) return;
            await update(ref(database, 'products/' + productKey), { name: newName });
            showToast('✅ Product name updated!');
            loadProducts();
        };

        window.editPackageName = async function(productKey, pkgKey, currentName) {
            const newName = prompt('✏️ Change package name\n\nCurrent:', currentName);
            if (newName === null || newName === '' || newName === currentName) return;
            await update(ref(database, 'products/' + productKey + '/packages/' + pkgKey), { name: newName });
            showToast('✅ Package name updated!');
            loadProducts();
        };

        window.togglePackages = function(key) {
            const container = document.getElementById('packages-' + key);
            const arrow = document.getElementById('arrow-' + key);
            if (container.style.display === 'none' || container.style.display === '') {
                container.style.display = 'flex';
                arrow.textContent = '▼';
            } else {
                container.style.display = 'none';
                arrow.textContent = '▶';
            }
        };

        window.adminAddMoney = async function(userId, userName) {
            const amount = prompt('Add money to ' + userName + '\'s wallet\n\nEnter amount:', '100');
            if (amount === null || amount === '') return;
            const amt = parseInt(amount);
            if (isNaN(amt) || amt < 1) {
                alert('❌ Invalid amount!');
                return;
            }
            if (!confirm('Add ৳ ' + amt + ' to ' + userName + '\'s wallet?')) return;
            const userRef = ref(database, 'users/' + userId);
            const snapshot = await get(userRef);
            if (snapshot.exists()) {
                const userData = snapshot.val();
                const newWallet = (userData.wallet || 0) + amt;
                await update(userRef, { wallet: newWallet });
                const trxRef = ref(database, 'transactions');
                await push(trxRef, {
                    userId: userId,
                    userName: userName,
                    userEmail: userData.email,
                    amount: amt,
                    method: 'admin',
                    senderNumber: 'ADMIN',
                    trxId: 'ADMIN-' + Date.now(),
                    status: 'Approved',
                    date: new Date().toISOString(),
                    approvedDate: new Date().toISOString(),
                    note: 'Added by Admin'
                });
                showToast('✅ ৳ ' + amt + ' added to ' + userName + '\'s wallet!');
                loadData();
            }
        };

        window.adminDeductMoney = async function(userId, userName, currentWallet) {
            const amount = prompt('Deduct money from ' + userName + '\'s wallet\n\nCurrent Balance: ৳ ' + currentWallet + '\n\nEnter amount:', '100');
            if (amount === null || amount === '') return;
            const amt = parseInt(amount);
            if (isNaN(amt) || amt < 1) {
                alert('❌ Invalid amount!');
                return;
            }
            if (amt > currentWallet) {
                alert('❌ Amount is greater than user\'s wallet!');
                return;
            }
            if (!confirm('Deduct ৳ ' + amt + ' from ' + userName + '\'s wallet?')) return;
            const userRef = ref(database, 'users/' + userId);
            const snapshot = await get(userRef);
            if (snapshot.exists()) {
                const userData = snapshot.val();
                const newWallet = (userData.wallet || 0) - amt;
                await update(userRef, { wallet: newWallet });
                showToast('✅ ৳ ' + amt + ' deducted from ' + userName + '\'s wallet!');
                loadData();
            }
        };

        async function loadProducts() {
            const snapshot = await get(ref(database, 'products'));
            const list = document.getElementById('productsList');
            list.innerHTML = '';
            
            if (!snapshot.exists()) {
                list.innerHTML = '<p style="text-align:center;color:#888;padding:20px;">No products yet.</p>';
                return;
            }

            const products = snapshot.val();
            for (const key in products) {
                const p = products[key];
                const isOut = p.stock === 'out';
                
                let packagesHtml = '';
                if (p.packages) {
                    for (const pkgKey in p.packages) {
                        const pkg = p.packages[pkgKey];
                        const pkgOut = pkg.stock === 'out';
                        const safeName = pkg.name.replace(/`/g, '\\`').replace(/'/g, "\\'");
                        packagesHtml += `
                            <div class="pkg-row ${pkgOut ? 'pkg-out' : ''}">
                                <span class="pkg-info">${pkg.name} - <strong style="color:#8b00ff;">৳ ${pkg.price}</strong></span>
                                <div class="pkg-actions">
                                    <button class="btn-edit" onclick="editPackageName('${key}', '${pkgKey}', \`${safeName}\`)">✏️ Name</button>
                                    <button class="btn-edit" onclick="editPrice('${key}', '${pkgKey}', ${pkg.price}, \`${safeName}\`)">💰 Price</button>
                                    <button class="btn-toggle ${pkgOut ? 'stock-out' : 'stock-in'}" onclick="togglePackageStock('${key}', '${pkgKey}', '${pkg.stock}')">
                                        ${pkgOut ? '❌ Out' : '✅ In'}
                                    </button>
                                </div>
                            </div>
                        `;
                    }
                }

                const safeProductName = p.name.replace(/`/g, '\\`').replace(/'/g, "\\'");
                const safeImage = p.image.replace(/`/g, '\\`').replace(/'/g, "\\'");

                list.innerHTML += `
                    <div class="product-admin-card ${isOut ? 'product-out' : ''}">
                        <div class="product-admin-header" onclick="togglePackages('${key}')" style="cursor:pointer;">
                            <img src="${p.image}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/70x70/8b00ff/ffffff?text=No+Image'">
                            <div class="product-admin-info">
                                <h4>${p.name} <span id="arrow-${key}" style="color:#8b00ff;font-size:14px;">▶</span></h4>
                                <p>${Object.keys(p.packages || {}).length} Packages - Click to expand</p>
                            </div>
                            <button class="btn-toggle ${isOut ? 'stock-out' : 'stock-in'}" onclick="event.stopPropagation(); toggleProductStock('${key}', '${p.stock}')">
                                ${isOut ? '❌ Product OFF' : '✅ Product ON'}
                            </button>
                        </div>
                        <div class="product-edit-actions">
                            <button class="btn-edit-img" onclick="editProductImage('${key}', \`${safeImage}\`, \`${safeProductName}\`)">📸 Change Image</button>
                            <button class="btn-edit-img" onclick="editProductName('${key}', \`${safeProductName}\`)">✏️ Change Name</button>
                        </div>
                        <div class="packages-container" id="packages-${key}" style="display:none;">
                            ${packagesHtml}
                        </div>
                    </div>
                `;
            }
        }

        async function loadData() {
            const trxSnapshot = await get(ref(database, 'transactions'));
            const trxList = document.getElementById('transactionsList');
            let pendingCount = 0;
            trxList.innerHTML = '';
            
            if (trxSnapshot.exists()) {
                const transactions = trxSnapshot.val();
                Object.entries(transactions).reverse().forEach(([id, trx]) => {
                    if (trx.status === 'Pending') pendingCount++;
                    const statusColor = trx.status === 'Pending' ? '#ffaa00' : trx.status === 'Approved' ? '#00ff88' : '#ff6b6b';
                    const date = new Date(trx.date).toLocaleString('en-GB');
                    trxList.innerHTML += `
                        <div class="admin-item">
                            <div class="admin-item-info">
                                <h4>${trx.userName} <span style="color:${statusColor};">● ${trx.status}</span></h4>
                                <p>📧 ${trx.userEmail}</p>
                                <p>💰 <strong style="color:#8b00ff;">৳ ${trx.amount}</strong> | ${trx.method.toUpperCase()}</p>
                                <p>📱 From: ${trx.senderNumber} | TrxID: <strong>${trx.trxId}</strong></p>
                                <p style="font-size:12px;color:#888;">${date}</p>
                            </div>
                            ${trx.status === 'Pending' ? `<div class="admin-actions">
                                <button class="btn-approve" onclick="approveTransaction('${id}', '${trx.userId}', ${trx.amount})">✅ Approve</button>
                                <button class="btn-reject" onclick="rejectTransaction('${id}')">❌ Reject</button>
                            </div>` : ''}
                        </div>`;
                });
            } else {
                trxList.innerHTML = '<p style="text-align:center;color:#888;padding:20px;">No transactions yet</p>';
            }
            document.getElementById('pendingCount').textContent = pendingCount;

            const ordSnapshot = await get(ref(database, 'orders'));
            const ordList = document.getElementById('ordersList');
            let orderCount = 0;
            ordList.innerHTML = '';
            if (ordSnapshot.exists()) {
                const orders = ordSnapshot.val();
                const ordArray = Object.entries(orders).reverse();
                orderCount = ordArray.length;
                ordArray.forEach(([id, ord]) => {
                    const statusColor = ord.status === 'Pending' ? '#ffaa00' : ord.status === 'Complete' ? '#00ff88' : '#ff6b6b';
                    const date = new Date(ord.orderDate).toLocaleString('en-GB');
                    ordList.innerHTML += `
                        <div class="admin-item">
                            <div class="admin-item-info">
                                <h4>${ord.userName} <span style="color:${statusColor};">● ${ord.status}</span></h4>
                                <p>🎮 ${ord.productName}</p>
                                <p>📦 ${ord.packageName} | <strong style="color:#8b00ff;">৳ ${ord.price}</strong></p>
                                <p>🆔 Player ID: <strong>${ord.playerId}</strong></p>
                                <p style="font-size:12px;color:#888;">${date}</p>
                            </div>
                            ${ord.status === 'Pending' ? `<div class="admin-actions">
                                <button class="btn-approve" onclick="updateOrderStatus('${id}', 'Complete')">✅ Complete</button>
                                <button class="btn-reject" onclick="updateOrderStatus('${id}', 'Failed')">❌ Failed</button>
                            </div>` : ''}
                        </div>`;
                });
            } else {
                ordList.innerHTML = '<p style="text-align:center;color:#888;padding:20px;">No orders yet</p>';
            }
            document.getElementById('totalOrdersCount').textContent = orderCount;

            const userSnapshot = await get(ref(database, 'users'));
            const userList = document.getElementById('usersList');
            let userCount = 0;
            userList.innerHTML = '';
            if (userSnapshot.exists()) {
                const users = userSnapshot.val();
                const usrArray = Object.entries(users);
                userCount = usrArray.length;
                usrArray.forEach(([uid, user]) => {
                    userList.innerHTML += `
                        <div class="admin-item">
                            <div class="admin-item-info">
                                <h4>${user.name}</h4>
                                <p>📧 ${user.email}</p>
                                <p>💰 Wallet: <strong style="color:#8b00ff;">৳ ${user.wallet || 0}</strong> | Spend: <strong>৳ ${user.totalSpend || 0}</strong></p>
                                <p>📦 Orders: ${user.orders || 0} | Rank: ${user.rank || 'Bronze'}</p>
                            </div>
                            <div class="admin-actions">
                                <button class="btn-approve" onclick="adminAddMoney('${uid}', '${user.name}')">➕ Add Money</button>
                                <button class="btn-reject" onclick="adminDeductMoney('${uid}', '${user.name}', ${user.wallet || 0})">➖ Deduct</button>
                            </div>
                        </div>`;
                });
            } else {
                userList.innerHTML = '<p style="text-align:center;color:#888;padding:20px;">No users yet</p>';
            }
            document.getElementById('totalUsers').textContent = userCount;

            loadProducts();
        }

        if (sessionStorage.getItem('adminLoggedIn') === 'true') {
            document.getElementById('pinScreen').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'block';
            loadData();
        }
    </script>

</body>
</html>
